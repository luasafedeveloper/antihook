<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>User Portal</title>
</head>
<body style="background:#111; color:#fff; text-align:center; padding:50px;">
    <h1>🔑 AntiHook 라이센스 인증</h1>
    <input type="text" id="userKey" placeholder="키를 입력하세요" style="padding:10px; width:300px;">
    <button onclick="loadScript()" style="padding:10px;">로더 받기</button>
    <br><br>
    <textarea id="result" rows="8" cols="60" readonly></textarea>

    <script>
        async function loadScript() {
            const res = await fetch('/api/user/loader', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key: document.getElementById('userKey').value})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('result').value = data.loader;
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
