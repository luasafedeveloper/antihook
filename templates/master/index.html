<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Master Portal</title>
</head>
<body style="background:#111; color:#fff; text-align:center; padding:50px;">
    <h1>👑 마스터 통제실</h1>
    <button onclick="login()" style="padding:10px; font-size:16px;">마스터 로그인</button>
    <button onclick="genCode()" style="padding:10px; font-size:16px;">새 라이센스 코드 발급</button>
    <h2 id="result" style="color:#00ff00; margin-top:20px;"></h2>

    <script>
        async function login() {
            const u = prompt("마스터 아이디 (solar):");
            const p = prompt("마스터 비밀번호:");
            const res = await fetch('/api/secret/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            if(res.ok) alert("마스터 로그인 성공!");
            else alert("비밀번호 오류!");
        }
        async function genCode() {
            const res = await fetch('/api/master/invite', { method: 'POST' });
            const data = await res.json();
            if(data.success) document.getElementById('result').innerText = "발급된 코드: " + data.code;
            else alert("로그인을 먼저 해주세요.");
        }
    </script>
</body>
</html>
